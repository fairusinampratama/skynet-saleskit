services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/local/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_started

  app:
    build:
      context: .
      dockerfile: Dockerfile.local
      args:
        USER_ID: ${UID:-1000}
        GROUP_ID: ${GID:-1000}
    environment:
      APP_NAME: "Skynet SalesKit"
      APP_ENV: local
      APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      APP_DEBUG: "false"
      APP_URL: "http://localhost:8000"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: saleskit
      DB_USERNAME: saleskit
      DB_PASSWORD: saleskit
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: public
      NPM_CONFIG_CACHE: /tmp/npm-cache
      PADDLEOCR_URL: http://ocr:8080
      PADDLEOCR_TIMEOUT: 45
    volumes:
      - .:/var/www/html
      - composer-cache:/home/saleskit/.composer/cache
    depends_on:
      ocr:
        condition: service_healthy
      mysql:
        condition: service_healthy

  queue:
    build:
      context: .
      dockerfile: Dockerfile.local
      args:
        USER_ID: ${UID:-1000}
        GROUP_ID: ${GID:-1000}
    command: bash -lc "php artisan queue:work --tries=3"
    environment:
      APP_NAME: "Skynet SalesKit"
      APP_ENV: local
      APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: saleskit
      DB_USERNAME: saleskit
      DB_PASSWORD: saleskit
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: public
      PADDLEOCR_URL: http://ocr:8080
      PADDLEOCR_TIMEOUT: 45
    volumes:
      - .:/var/www/html
      - composer-cache:/home/saleskit/.composer/cache
    depends_on:
      app:
        condition: service_started
      ocr:
        condition: service_healthy
      mysql:
        condition: service_healthy

  ocr:
    build:
      context: .
      dockerfile: docker/ocr/Dockerfile
    environment:
      PADDLEOCR_MODEL_DIR: /models
      PADDLE_PDX_CACHE_HOME: /models
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
      PADDLEOCR_LANG: en
      PADDLEOCR_DETECTION_MODEL: PP-OCRv5_mobile_det
      PADDLEOCR_RECOGNITION_MODEL: en_PP-OCRv5_mobile_rec
      PADDLEOCR_MAX_IMAGE_SIDE: 0
      PADDLEOCR_DET_LIMIT_SIDE_LEN: 960
      PADDLEOCR_DET_LIMIT_TYPE: max
      PADDLEOCR_REC_BATCH_SIZE: 8
    volumes:
      - paddleocr-models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)); raise SystemExit(0 if data.get('ready') else 1)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  mysql:
    image: mysql:8.4
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: saleskit
      MYSQL_USER: saleskit
      MYSQL_PASSWORD: saleskit
      MYSQL_ROOT_PASSWORD: saleskit-root
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-usaleskit", "-psaleskit"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  composer-cache:
  mysql-data:
  paddleocr-models:
