services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/local/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_started

  app:
    build:
      context: .
      dockerfile: Dockerfile.local
      args:
        USER_ID: ${UID:-1000}
        GROUP_ID: ${GID:-1000}
    environment:
      APP_NAME: "Skynet SalesKit"
      APP_ENV: local
      APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      APP_DEBUG: "false"
      APP_URL: "http://localhost:8000"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: saleskit
      DB_USERNAME: saleskit
      DB_PASSWORD: saleskit
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: public
      NPM_CONFIG_CACHE: /tmp/npm-cache
    volumes:
      - .:/var/www/html
      - composer-cache:/home/saleskit/.composer/cache
    depends_on:
      mysql:
        condition: service_healthy

  queue:
    build:
      context: .
      dockerfile: Dockerfile.local
      args:
        USER_ID: ${UID:-1000}
        GROUP_ID: ${GID:-1000}
    command: bash -lc "php artisan queue:work --tries=3"
    environment:
      APP_NAME: "Skynet SalesKit"
      APP_ENV: local
      APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: saleskit
      DB_USERNAME: saleskit
      DB_PASSWORD: saleskit
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: public
    volumes:
      - .:/var/www/html
      - composer-cache:/home/saleskit/.composer/cache
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: saleskit
      MYSQL_USER: saleskit
      MYSQL_PASSWORD: saleskit
      MYSQL_ROOT_PASSWORD: saleskit-root
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-usaleskit", "-psaleskit"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  composer-cache:
  mysql-data:
