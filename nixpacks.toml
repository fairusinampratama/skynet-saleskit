# Nixpacks Configuration for Skynet Saleskit
# Based on successful setup from skynet-ebilling

[phases.setup]
aptPkgs = [
    "nginx",
    "libgl1",
    "libglib2.0-0",
    "libstdc++6",
    "libgomp1"
]
nixPkgs = [
    "php83",
    "php83Packages.composer",
    "php83Extensions.pdo_mysql",
    "php83Extensions.bcmath",
    "php83Extensions.sockets",
    "php83Extensions.xml",
    "php83Extensions.mbstring",
    "php83Extensions.ctype",
    "php83Extensions.curl",
    "php83Extensions.dom",
    "php83Extensions.fileinfo",
    "php83Extensions.filter",
    "php83Extensions.tokenizer",
    "php83Extensions.pcntl",
    "php83Extensions.posix",
    "php83Extensions.zip",
    "php83Extensions.gd",
    "php83Extensions.intl",
    "nodejs_22",
    "npm-10_x",
    "python311",
    "python311Packages.pip",
    "python311Packages.setuptools",
    "python311Packages.virtualenv",
    "python311Packages.wheel",
    "python311Packages.supervisor",
    "iputils"
]

[variables]
APP_LOCALE = "id"
APP_FALLBACK_LOCALE = "id"
EASYOCR_PYTHON = "/app/.venv-ocr/bin/python"
EASYOCR_MODEL_DIR = "/app/storage/app/easyocr-models"
EASYOCR_TIMEOUT = "180"

[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-interaction --ignore-platform-req=php",
    "npm install",
    "python3 -m venv /app/.venv-ocr",
    "/app/.venv-ocr/bin/python -m pip install --upgrade pip setuptools wheel",
    "/app/.venv-ocr/bin/python -m pip install --no-cache-dir -r requirements-ocr.txt"
]

[phases.build]
cmds = [
    "npm run build",
    "php artisan octane:install --server=frankenphp --no-interaction",
    "chmod +x frankenphp"
]

[start]
# Run deployment script (migrations, cache, etc) then start Supervisor
cmd = "sh deploy.sh && supervisord -c supervisord.conf"
